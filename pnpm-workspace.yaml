packages:
  - 'apps/*'
  - 'packages/*'
# Expo/Metro/React Native require a hoisted (npm-style) node_modules layout.
# In pnpm v10+/v11 these settings are read from here, NOT from .npmrc.
nodeLinker: hoisted
autoInstallPeers: true
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
  # Transitive native dep of eas-cli (installed in CI by expo-github-action).
  # pnpm v11 returns non-zero on an un-acknowledged build script; allow it so
  # the EAS Update job's `pnpm add eas-cli` exits cleanly. No-op outside CI.
  dtrace-provider: true
overrides:
  convex: "1.42.3"
