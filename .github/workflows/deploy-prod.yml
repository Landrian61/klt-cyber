name: Deploy (production)

# Production pipeline. On every push to `prod`:
#   - convex-deploy  : pushes Convex functions/schema to the production
#                      deployment (the klt-cyber-prod project's prod
#                      deployment — see spec/DEPLOYMENT.md)
#   - mobile-update  : publishes an EAS Update (OTA) to the "production" channel
#
# The web admin (apps/admin) is NOT deployed here — it needs its own
# Cloudflare Workers Builds project watching the `prod` branch (separate
# dashboard setup, see spec/DEPLOYMENT.md §4.4). Until that project exists,
# this workflow only covers Convex and mobile.
#
# The two jobs are independent and run in parallel.
#
# Mirrors deploy-staging.yml; keep the two in sync on structure. Differences:
# target branch, the deploy key secret, and the EAS channel/vars suffix.

on:
  push:
    branches: [prod]

# Avoid overlapping production deploys if pushes land back-to-back.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  convex-deploy:
    name: Deploy Convex (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # pnpm 11.3.0 (root packageManager) requires Node >= 22.13; Node 20
          # breaks the pnpm cache step (node:sqlite missing). Matches eas.json
          # and Cloudflare NODE_VERSION.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CONVEX_DEPLOY_KEY_PROD is the production deploy key generated from
      # the klt-cyber-prod project's dashboard (its prod deployment, currently
      # superb-dog-305). It encodes the target deployment, so no --prod flag
      # is needed. convex/ lives at the repo root, so no working-directory
      # override.
      - name: Deploy Convex functions
        run: pnpm exec convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}

  mobile-update:
    name: EAS Update (production channel)
    runs-on: ubuntu-latest
    steps:
      # Runs at the workspace root (exists before checkout); fails fast if the
      # token is missing before doing any real work.
      - name: Check for EXPO_TOKEN
        # Read through the environment, not `${{ }}` interpolation — same
        # reasoning as the publish step below, and it keeps the secret's value
        # out of the generated script file on the runner.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN secret. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # pnpm 11.3.0 (root packageManager) requires Node >= 22.13; Node 20
          # breaks the pnpm cache step (node:sqlite missing). Matches eas.json
          # and Cloudflare NODE_VERSION.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Install eas-cli with npm (not pnpm): the action's `pnpm add eas-cli`
      # runs outside the workspace config, so pnpm v11 aborts on the
      # dtrace-provider build script (ERR_PNPM_IGNORED_BUILDS). npm has no such
      # gate. Project deps are still installed with pnpm in the next step.
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publishes an OTA update to the "production" EAS branch, which the
      # production channel is now bound to. EXPO_PUBLIC_* vars are re-inlined
      # into the update bundle at publish time, so they MUST be present here
      # — otherwise the OTA bundle ships an undefined Convex URL. These are
      # public (non-secret) values, stored as repository VARIABLES, and must
      # equal the eas.json `production` profile env (binary builds) to avoid
      # drift. These two repository variables need to be created before this
      # job can publish a correct bundle.
      - name: Publish EAS Update (production)
        working-directory: apps/mobile
        shell: bash
        env:
          # The commit message is passed as an ENV VAR, never interpolated into
          # the run script — see deploy-staging.yml for the injection reasoning.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL_PRODUCTION }}
          EXPO_PUBLIC_CONVEX_SITE_URL: ${{ vars.EXPO_PUBLIC_CONVEX_SITE_URL_PRODUCTION }}
          # Not a secret — Sentry DSNs are meant to be public, embedded in the
          # client bundle like the Convex URLs above. Same DSN as staging: one
          # klt-cyber-mobile Sentry project, only the environment tag differs.
          EXPO_PUBLIC_SENTRY_DSN: https://a1b6355e14f4bff5a0b5efbec27cbcf3@o4512225003896832.ingest.de.sentry.io/4512225028538448
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          EXPO_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
        run: |
          # Subject line only, length-capped. `eas update --message` is a short
          # changelog label shown in the Expo dashboard — a full commit body
          # exceeds what it accepts and reads as noise there. Pure bash
          # expansion (no cut/head) so multi-byte characters can't be split.
          SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"
          SUBJECT="${SUBJECT:0:180}"
          # Merge commits and amends can leave this empty; fall back to the SHA.
          [ -n "$SUBJECT" ] || SUBJECT="${GITHUB_SHA:0:7}"
          # Exported separately (rather than letting `eas update` bundle
          # in-place) so the same build output can be handed to the source
          # map uploader below — same debug IDs either way (spec 0002-sentry-observability.md AC-7).
          npx expo export --platform all --output-dir dist
          eas update --branch production --message "$SUBJECT" --non-interactive --skip-bundler-cache

      # AC-7: resolves a Sentry stack trace on a production OTA update back
      # to real source. Skips quietly (never fails the deploy) until the
      # provisioning step (0002-sentry-observability.md Build plan step 1)
      # has actually produced a token.
      - name: Upload source maps to Sentry
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: klt-cyber
          SENTRY_PROJECT: klt-cyber-mobile
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set yet — skipping source map upload."
            exit 0
          fi
          npx sentry-expo-upload-sourcemaps dist
