name: Deploy (staging)

# Staging pipeline. On every push to `main`:
#   - convex-deploy  : pushes Convex functions/schema to the staging deployment
#                      (the klt-cyber project's prod deployment — see docs/DEPLOYMENT.md)
#   - mobile-update  : publishes an EAS Update (OTA) to the "staging" channel
#
# The web admin (apps/admin) is NOT deployed here — Cloudflare Workers Builds
# deploys it via its own native Git integration on push to main.
#
# The two jobs are independent and run in parallel.
#
# pnpm version is read from the root package.json `packageManager` field
# (pnpm@11.x); do NOT also pass `version:` to pnpm/action-setup or it errors
# with "Multiple versions of pnpm specified".

on:
  push:
    branches: [main]

# Avoid overlapping staging deploys if pushes land back-to-back.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  convex-deploy:
    name: Deploy Convex (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # pnpm 11.3.0 (root packageManager) requires Node >= 22.13; Node 20
          # breaks the pnpm cache step (node:sqlite missing). Matches eas.json
          # and Cloudflare NODE_VERSION.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CONVEX_DEPLOY_KEY encodes the target deployment, so no --prod flag is
      # needed. convex/ lives at the repo root, so no working-directory override.
      - name: Deploy Convex functions
        run: pnpm exec convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  mobile-update:
    name: EAS Update (staging channel)
    runs-on: ubuntu-latest
    steps:
      # Runs at the workspace root (exists before checkout); fails fast if the
      # token is missing before doing any real work.
      - name: Check for EXPO_TOKEN
        # Read through the environment, not `${{ }}` interpolation — same
        # reasoning as the publish step below, and it keeps the secret's value
        # out of the generated script file on the runner.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN secret. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # pnpm 11.3.0 (root packageManager) requires Node >= 22.13; Node 20
          # breaks the pnpm cache step (node:sqlite missing). Matches eas.json
          # and Cloudflare NODE_VERSION.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Install eas-cli with npm (not pnpm): the action's `pnpm add eas-cli`
      # runs outside the workspace config, so pnpm v11 aborts on the
      # dtrace-provider build script (ERR_PNPM_IGNORED_BUILDS). npm has no such
      # gate. Project deps are still installed with pnpm in the next step.
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publishes an OTA update to the "staging" branch, which the staging
      # channel is bound to. EXPO_PUBLIC_* vars are re-inlined into the update
      # bundle at publish time, so they MUST be present here — otherwise the
      # OTA bundle ships an undefined Convex URL. These are public (non-secret)
      # values, stored as repository VARIABLES, and must equal the eas.json
      # `preview` profile env (binary builds) to avoid drift.
      - name: Publish EAS Update (staging)
        working-directory: apps/mobile
        shell: bash
        env:
          # The commit message is passed as an ENV VAR, never interpolated into
          # the run script. `${{ }}` substitution happens before bash parses the
          # line, so a message containing a quote, a backtick or a newline used
          # to be spliced in as shell syntax — backticks executed as command
          # substitution and the rest broke out of the quoting, which is how
          # this job started failing on longer commit messages.
          #
          # It is also a script-injection hole, not just a formatting bug: this
          # runner holds EXPO_TOKEN, and anyone who can land a commit on main
          # controls the message. Env vars are set by the runner rather than
          # pasted into the script, so the value can never be parsed as code.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL_STAGING }}
          EXPO_PUBLIC_CONVEX_SITE_URL: ${{ vars.EXPO_PUBLIC_CONVEX_SITE_URL_STAGING }}
        run: |
          # Subject line only, length-capped. `eas update --message` is a short
          # changelog label shown in the Expo dashboard — a full commit body
          # exceeds what it accepts and reads as noise there. Pure bash
          # expansion (no cut/head) so multi-byte characters can't be split.
          SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"
          SUBJECT="${SUBJECT:0:180}"
          # Merge commits and amends can leave this empty; fall back to the SHA.
          [ -n "$SUBJECT" ] || SUBJECT="${GITHUB_SHA:0:7}"
          eas update --branch staging --message "$SUBJECT" --non-interactive
